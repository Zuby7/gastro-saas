name: Migration Check

# Validates supabase/migrations/** and (since ticket #4) the tenant-isolation
# integration test in packages/database, plus (since ticket #5) the reusable
# cross-tenant test harness's self-test in packages/testing. This is the
# "Migration Validation" gate referenced in docs/testing/test-strategy.md's
# CI gate order, and it is a required status check on `main` (see
# docs/testing/test-strategy.md for the enforced gate list) -- a broken
# migration or a failing cross-tenant RLS test blocks merge.
#
# This job is intentionally its own workflow file, separate from
# .github/workflows/ci.yml (format/lint/typecheck/unit/build/secret-scan),
# so a `supabase start` failure or the RLS integration test are attributable
# to their own named status check. Consider merging this job into ci.yml as
# its own step later for a single CI entrypoint; not done yet since the two
# workflows have historically evolved independently.
#
# Design choice: GitHub-hosted ubuntu-latest runners have Docker available
# natively (not nested virtualization), so a real `supabase start` -- which
# pulls the local Postgres/Auth/Studio images and applies every migration in
# supabase/migrations/ against a fresh database -- is realistic here and is
# the strongest signal that migrations are both syntactically valid AND
# actually apply cleanly (catches things a pure SQL lint would miss, e.g. a
# migration that depends on an extension or an earlier migration's schema).
# `supabase db lint` runs afterwards for additional static diagnostics
# (unindexed foreign keys, etc.). If this job becomes flaky/slow as the
# migration set grows, the fallback is a lighter `supabase db lint`-only step
# without `supabase start` -- not implemented now because the full start is
# currently fast (single example migration) and gives strictly more coverage.
#
# Ticket #4 adds a "Run integration tests" step after `supabase start`: the
# required cross-tenant RLS test (packages/database/src/tenants.integration.test.ts)
# needs a real local Supabase Postgres instance. This runner provides it
# reliably; it has also been verified locally on the dev machine since the
# Docker/disk-space blocker that originally motivated this workflow was
# resolved.
#
# Ticket #5 adds a second integration step: the reusable cross-tenant test
# harness's own self-test (packages/testing/src/tenant-fixture.integration.test.ts),
# which exercises `seedTwoTenantFixture` / `expectCrossTenantDenied` against
# the same real database.
#
# No path filters: this job is a required status check on `main`, and a
# path-filtered required check would leave PRs that don't touch
# supabase/**/packages/database/** stuck on "Expected -- waiting for status
# to be reported" forever (hit in practice; see PR #48's review history).
# It runs on every PR/push to main unconditionally instead.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: migration-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to match packages/database's devDependency (currently
          # "^2" resolving to 2.111.0 in pnpm-lock.yaml) so CI uses the same
          # CLI version developers run locally. Keep this in sync whenever
          # that devDependency is bumped.
          version: 2.111.0

      - name: Start local Supabase stack (applies all migrations)
        run: supabase start

      - name: Lint migrations
        run: supabase db lint

      - name: Run integration tests (RLS / tenant isolation)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @gastro-saas/database test:integration

      - name: Run cross-tenant test harness self-test (ticket #5)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @gastro-saas/testing test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
