title = "gastro-saas gitleaks config"

[extend]
# Start from gitleaks' built-in default rule set and layer our allowlist on top.
useDefault = true

[allowlist]
description = "Publicly documented local-dev-only defaults, not real secrets"
paths = [
  '''^\.env\.example$''',
]
# Fake secret-shaped fixtures in packages/domain/src/audit/secret-detection.test.ts
# (ticket #6, negative-testing recordAuditEvent()'s secret detector) are
# allowlisted individually via inline `# gitleaks:allow` comments on the
# exact lines in that file, not via a whole-file path allowlist here --
# narrower blast radius: unrelated real secrets accidentally added to that
# file later would still be caught.
