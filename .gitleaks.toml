title = "gastro-saas gitleaks config"

[extend]
# Start from gitleaks' built-in default rule set and layer our allowlist on top.
useDefault = true

[allowlist]
description = "Publicly documented local-dev-only defaults, or fake secret-shaped test fixtures, not real secrets"
paths = [
  '''^\.env\.example$''',
  # Fixtures for negative-testing recordAuditEvent()'s secret detector
  # (ticket #6) -- deliberately secret-*shaped* fake values (fake JWT, fake
  # sk_test_ token, fake card number) so the detector has something real to
  # reject. Not real credentials.
  '''^packages/domain/src/audit/secret-detection\.test\.ts$''',
]
